<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lenny Gadroy - Projects Sections</title>
  <style>
    @font-face {font-family: "myFont"; src: url("assets/myFont.ttf");}
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: "myFont";
      overflow-x: hidden;
    }

    img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    p {
      font-size: 42px;
      font-weight: 500;
      text-transform: uppercase;
    }

    section {
      width: 100%;
      height: 100vh;
    }

    section.Services {
      padding: 4em;
      background: #87795f;
    }

    section.Marquees {
      height: 150vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background-color: #fff;
    }

    .MarqueesContainer {
      position: relative;
      width: 125%;
      height: 250px;
      display: flex;
      gap: 1em;
      margin-bottom: 1em;
      overflow: hidden;
    }

    .Marquee {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 50%;
      left: 0;
      transform: translateY(-50%);
      display: flex;
      gap: 1em;
    }

    #Marquee1 .Marquee, #Marquee3 .Marquee {left: -15%;}

    .Item {
      flex: 1;
      display: flex;
      justify-content: center;
      align-Items: center;
    }

    .Item h1 {
      text-transform: uppercase;
      font-size: 140px;
    }

    .Item.ItemText {flex: 1.5;}

    @media (max-width: 900px) {
      section.Marquees {height: 100vh;}

      .MarqueesContainer {
        width: 250%;
        height: 150px;
      }

      #Marquee2 .Marquee,
      #Marquee4 .Marquee {
        left: -35%;
      }

      .Item.ItemText {flex: 1;}
      .Item h1 {font-size: 60px;}
    }

    html.Lennouille, html.Lennouille body {height: auto;}
    .Lennouille.LennouilleSmooth {scroll-behavior: auto !important;}
    .Lennouille.LennouilleSmooth [data-Lennouille-prevent] {overscroll-behavior: contain;}
    .Lennouille.LennouilleStopped {overflow: hidden;}
    .Lennouille.LennouilleSmooth iframe {pointer-events: none;}
  </style>
</head>
<body>
  <div class="Container">
    <section class="Marquees">
      <div class="MarqueesContainer" id="Marquee1">
        <div class="Marquee">
          <div class="Item"><img src="img/img1.jpg" alt="" /></div>
          <div class="Item ItemText"><h1>Unique</h1></div>
          <div class="Item"><img src="img/img2.jpg" alt="" /></div>
          <div class="Item"><img src="img/img3.jpg" alt="" /></div>
          <div class="Item"><img src="img/img4.jpg" alt="" /></div>
        </div>
      </div>
      <div class="MarqueesContainer" id="Marquee2">
        <div class="Marquee">
          <div class="Item"><img src="img/img5.jpg" alt="" /></div>
          <div class="Item"><img src="img/img6.jpg" alt="" /></div>
          <div class="Item"><img src="img/img7.jpg" alt="" /></div>
          <div class="Item ItemText"><h1>Release</h1></div>
          <div class="Item"><img src="img/img8.jpg" alt="" /></div>
        </div>
      </div>
      <div class="MarqueesContainer" id="Marquee3">
        <div class="Marquee">
          <div class="Item"><img src="img/img9.jpg" alt="" /></div>
          <div class="Item ItemText"><h1>2500</h1></div>
          <div class="Item"><img src="img/img10.jpg" alt="" /></div>
          <div class="Item"><img src="img/img11.jpg" alt="" /></div>
          <div class="Item"><img src="img/img12.jpg" alt="" /></div>
        </div>
      </div>
      <div class="MarqueesContainer" id="Marquee4">
        <div class="Marquee">
          <div class="Item"><img src="img/img13.jpg" alt="" /></div>
          <div class="Item"><img src="img/img14.jpg" alt="" /></div>
          <div class="Item"><img src="img/img15.jpg" alt="" /></div>
          <div class="Item ItemText"><h1>Rarity</h1></div>
          <div class="Item"><img src="img/img16.jpg" alt="" /></div>
        </div>
      </div>
    </section>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="scroll-anim.js"></script>
</body>
</html>
