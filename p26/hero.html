<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lenny Gadroy - Hero Section</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        .HeroContainer {
            position: relative;
            width: 100%;
            max-width: 900px; 
            aspect-ratio: 9 / 7; 
        }

        .LetterGrid {
            position: relative;
            z-index: 2;
            display: Grid;
            Grid-template-columns: repeat(9, 1fr);
            Grid-template-rows: repeat(7, 1fr);
            width: 100%;
            height: 100%;
        }

        .LetterGrid span {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(1rem, 3.5vw, 2.5rem);
            font-weight: 400;
            color: #1a1a1a;
            user-select: none;
            transition: all 0.3s ease;
            opacity: 0; 
            transform: translateY(10px);
        }

        .LetterGrid span.AnimLetter {
            animation: fadeInLetter 0.5s cubic-bezier(0.8, 0, 0.2, 1) forwards;
        }

        @keyframes fadeInLetter {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .Highlights {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .HighlightShape {
            fill: none;
            stroke: #447794;
            stroke-width: 8;
            stroke-linecap: round;
            transition: all 0.3s ease;
            stroke-dasharray: 2000;
            stroke-dashoffset: 2000;
            animation: drawCircle 1.2s cubic-bezier(0.8, 0, 0.2, 1) forwards;
        }

        .HighlightShape.AnimHighlight {
            animation-name: drawCircle;
        }

        @keyframes drawCircle {
            to {
                stroke-dashoffset: 0;
            }
        }

        .HighlightShape.HighlightActive {
            stroke-width: 12;
            filter: drop-shadow(0 0 5px rgba(68, 119, 148, 0.4)); 
        }

        .LetterGrid span.LetterActive {
            font-weight: 700;
            color: #447794;
        }
    </style>
</head>
<body>

    <div class="HeroContainer" id="HeroContainer">  
        <svg class="Highlights" viewBox="0 0 900 700" preserveAspectRatio="xMidYMid meet">
            <rect class="HighlightShape" x="15" y="315" width="470" height="70" rx="35" data-word="Lenny"/>
            <rect class="HighlightShape" x="211.5" y="365" width="777" height="70" rx="35" transform="rotate(45 600 400)" data-word="Gadroy"/>
            <rect class="HighlightShape" x="15" y="15" width="870" height="70" rx="35" data-word="Portfolio"/>
            <rect class="HighlightShape" x="115" y="515" width="170" height="70" rx="35" data-word="UI"/>
            <rect class="HighlightShape" x="415" y="515" width="170" height="70" rx="35" data-word="UX"/>
            <rect class="HighlightShape" x="15" y="615" width="770" height="70" rx="35" data-word="Designer"/>
        </svg>
        <div class="LetterGrid" id="LetterGrid">
            <span data-word="Portfolio">P</span><span data-word="Portfolio">O</span><span data-word="Portfolio">R</span><span data-word="Portfolio">T</span><span data-word="Portfolio">F</span><span data-word="Portfolio">O</span><span data-word="Portfolio">L</span><span data-word="Portfolio">I</span><span data-word="Portfolio">O</span>
            <span>S</span><span>E</span><span>O</span><span data-word="Gadroy">G</span><span>P</span><span>R</span><span>O</span><span>S</span><span>C</span>
            <span>C</span><span>O</span><span>O</span><span>L</span><span data-word="Gadroy">A</span><span>G</span><span>O</span><span>A</span><span>L</span>
            <span data-word="Lenny">L</span><span data-word="Lenny">E</span><span data-word="Lenny">N</span><span data-word="Lenny">N</span><span data-word="Lenny">Y</span><span data-word="Gadroy">D</span><span>A</span><span>T</span><span>A</span>
            <span>O</span><span>C</span><span>L</span><span>E</span><span>V</span><span>E</span><span data-word="Gadroy">R</span><span>U</span><span>S</span>
            <span>U</span><span data-word="UI">U</span><span data-word="UI">I</span><span>T</span><span data-word="UX">U</span><span data-word="UX">X</span><span>C</span><span data-word="Gadroy">O</span><span>S</span>
            <span data-word="Designer">D</span><span data-word="Designer">E</span><span data-word="Designer">S</span><span data-word="Designer">I</span><span data-word="Designer">G</span><span data-word="Designer">N</span><span data-word="Designer">E</span><span data-word="Designer">R</span><span data-word="Gadroy">Y</span>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const Grid = document.getElementById('LetterGrid');
            const Letters = Grid.querySelectorAll('span');
            const Highlights = document.querySelectorAll('.HighlightShape');
            const HeroContainer = document.getElementById('HeroContainer');

            const LetterFadeStagger = 0.05;
            const HighlightDrawDelay = Letters.length * LetterFadeStagger + 0.5;
            const HighlightStagger = 0.6;

        Letters.forEach((letter, index) => {
            const Delay = index * LetterFadeStagger;
            letter.style.animationDelay = Delay + 's';
            letter.classList.add('AnimLetter');
        });

        Highlights.forEach((highlight, index) => {
            const Delay = HighlightDrawDelay + (index * HighlightStagger);
            highlight.style.animationDelay = Delay + 's';
            highlight.classList.add('AnimHighlight');
        });

        HeroContainer.addEventListener('mouseover', (e) => {
            const TargetWord = e.target.getAttribute('data-word');
            if (TargetWord) {activateWordHighlight(TargetWord);}
        });
        HeroContainer.addEventListener('mouseout', (e) => {
            const TargetWord = e.target.getAttribute('data-word');
            if (TargetWord) {deactivateWordHighlight(TargetWord);}
        });

        function activateWordHighlight(wordName) {
            const ActiveHighlight = document.querySelector(`.HighlightShape[data-word="${wordName}"]`);
            if (ActiveHighlight) {ActiveHighlight.classList.add('HighlightActive');}
            const ActiveLetters = document.querySelectorAll(`.LetterGrid span[data-word="${wordName}"]`);
            ActiveLetters.forEach(letter => {letter.classList.add('LetterActive');});
        }
        function deactivateWordHighlight(wordName) {
            const ActiveHighlight = document.querySelector(`.HighlightShape[data-word="${wordName}"]`);
            if (ActiveHighlight) {ActiveHighlight.classList.remove('HighlightActive');}
            const ActiveLetters = document.querySelectorAll(`.LetterGrid span[data-word="${wordName}"]`);
            ActiveLetters.forEach(letter => {letter.classList.remove('LetterActive');});
        }
    });
    </script>

</body>
