<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lenny Gadroy - Hero Section</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            padding: 2rem;
            overflow: hidden;
        }

        .hero-container {
            position: relative;
            width: 100%;
            max-width: 900px; 
            aspect-ratio: 9 / 7; 
        }

        .letter-grid {
            position: relative;
            z-index: 2;
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            grid-template-rows: repeat(7, 1fr);
            width: 100%;
            height: 100%;
        }

        .letter-grid span {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(1rem, 3.5vw, 2.5rem);
            font-weight: 400;
            color: #1a1a1a;
            user-select: none;
            transition: all 0.3s ease;
            opacity: 0; 
            transform: translateY(10px);
        }

        .letter-grid span.animate-letter {
            animation: fadeInLetter 0.5s cubic-bezier(0.8, 0, 0.2, 1) forwards;
        }

        @keyframes fadeInLetter {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .highlights {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .highlight-shape {
            fill: none;
            stroke: #447794;
            stroke-width: 8;
            stroke-linecap: round;
            transition: all 0.3s ease;
            stroke-dasharray: 2000;
            stroke-dashoffset: 2000;
            animation: drawCircle 1.2s cubic-bezier(0.8, 0, 0.2, 1) forwards;
        }

        .highlight-shape.animate-highlight {
            animation-name: drawCircle;
        }

        @keyframes drawCircle {
            to {
                stroke-dashoffset: 0;
            }
        }

        .highlight-shape.highlight-active {
            stroke-width: 12;
            filter: drop-shadow(0 0 5px rgba(68, 119, 148, 0.4)); 
        }

        .letter-grid span.letter-active {
            font-weight: 700;
            color: #447794;
        }
    </style>
</head>
<body>

    <div class="hero-container" id="heroContainer">
        
        <svg class="highlights" viewBox="0 0 900 700" preserveAspectRatio="xMidYMid meet">
            <rect class="highlight-shape" x="15" y="315" width="470" height="70" rx="35" data-word="lenny" />
            <rect class="highlight-shape" x="211.5" y="365" width="777" height="70" rx="35" transform="rotate(45 600 400)" data-word="gadroy" />
            <rect class="highlight-shape" x="15" y="15" width="870" height="70" rx="35" data-word="portfolio" />
            <rect class="highlight-shape" x="115" y="515" width="170" height="70" rx="35" data-word="ui" />
            <rect class="highlight-shape" x="415" y="515" width="170" height="70" rx="35" data-word="ux" />
            <rect class="highlight-shape" x="15" y="615" width="770" height="70" rx="35" data-word="designer" />
        </svg>

        <div class="letter-grid" id="letterGrid">
            <span data-word="portfolio">P</span><span data-word="portfolio">O</span><span data-word="portfolio">R</span><span data-word="portfolio">T</span><span data-word="portfolio">F</span><span data-word="portfolio">O</span><span data-word="portfolio">L</span><span data-word="portfolio">I</span><span data-word="portfolio">O</span>
            <span>S</span><span>E</span><span>O</span><span data-word="gadroy">G</span><span>P</span><span>R</span><span>O</span><span>S</span><span>C</span>
            <span>C</span><span>O</span><span>O</span><span>L</span><span data-word="gadroy">A</span><span>G</span><span>O</span><span>A</span><span>L</span>
            <span data-word="lenny">L</span><span data-word="lenny">E</span><span data-word="lenny">N</span><span data-word="lenny">N</span><span data-word="lenny">Y</span><span data-word="gadroy">D</span><span>A</span><span>T</span><span>A</span>
            <span>O</span><span>C</span><span>L</span><span>E</span><span>V</span><span>E</span><span data-word="gadroy">R</span><span>U</span><span>S</span>
            <span>U</span><span data-word="ui">U</span><span data-word="ui">I</span><span>T</span><span data-word="ux">U</span><span data-word="ux">X</span><span>C</span><span data-word="gadroy">O</span><span>S</span>
            <span data-word="designer">D</span><span data-word="designer">E</span><span data-word="designer">S</span><span data-word="designer">I</span><span data-word="designer">G</span><span data-word="designer">N</span><span data-word="designer">E</span><span data-word="designer">R</span><span data-word="gadroy">Y</span>
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const grid = document.getElementById('letterGrid');
            const letters = grid.querySelectorAll('span');
            const highlights = document.querySelectorAll('.highlight-shape');
            const heroContainer = document.getElementById('heroContainer');

            const letterFadeStagger = 0.05;
            const highlightDrawDelay = letters.length * letterFadeStagger + 0.5;
            const highlightStagger = 0.6;

            letters.forEach((letter, index) => {
                const delay = index * letterFadeStagger;
                letter.style.animationDelay = delay + 's';
                letter.classList.add('animate-letter');
            });

            highlights.forEach((highlight, index) => {
                const delay = highlightDrawDelay + (index * highlightStagger);
                highlight.style.animationDelay = delay + 's';
                highlight.classList.add('animate-highlight');
            });

            heroContainer.addEventListener('mouseover', (e) => {
                const targetWord = e.target.getAttribute('data-word');
                if (targetWord) {
                    activateWordHighlight(targetWord);
                }
            });

            heroContainer.addEventListener('mouseout', (e) => {
                const targetWord = e.target.getAttribute('data-word');
                if (targetWord) {
                    deactivateWordHighlight(targetWord);
                }
            });

            function activateWordHighlight(wordName) {
                const activeHighlight = document.querySelector(`.highlight-shape[data-word="${wordName}"]`);
                if (activeHighlight) {
                    activeHighlight.classList.add('highlight-active');
                }

                const activeLetters = document.querySelectorAll(`.letter-grid span[data-word="${wordName}"]`);
                activeLetters.forEach(letter => {
                    letter.classList.add('letter-active');
                });
            }

            function deactivateWordHighlight(wordName) {
                const activeHighlight = document.querySelector(`.highlight-shape[data-word="${wordName}"]`);
                if (activeHighlight) {
                    activeHighlight.classList.remove('highlight-active');
                }

                const activeLetters = document.querySelectorAll(`.letter-grid span[data-word="${wordName}"]`);
                activeLetters.forEach(letter => {
                    letter.classList.remove('letter-active');
                });
            }
        });
    </script>

</body>
