<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lenny Gadroy | Portfolio - Contactez moi</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg" href="assets/icon.svg">
</head>
<body>
    <div id="HeaderPlaceHolder"></div><script src="header.js"></script>
    <main class="Contact">
        <h1 class="PageTitle sr-only">Contactez Lenny Gadroy - Recherche de stage en Développement Web</h1>
        <div id="CreatePlaceHolder"></div><script src="create.js"></script>
        <div class="ContactGrid">
            <div class="ContactCol">
                <div class="Panel">
                    <h2 class="PanelTitle">Mes Coordonnées</h2>
                    <ul class="ContactList">
                        <li><a href="mailto:lennygadroy@gmail.com?subject=Contact via Portfolio" class="ContactLink" itemprop="email">lennygadroy@gmail.com</a></li>
                        <li><a href="tel:0652514919" class="ContactLink" itemprop="telephone">06 52 51 49 19</a></li>
                        <hr class="Divider">
                        <li><a href="https://linkedin.com/in/LennyGadroy" target="_blank" class="ContactLink">LinkedIn</a></li>
                        <li><a href="https://instagram.com/lennygdr19/" target="_blank" class="ContactLink">Instagram</a></li>
                        <li><a href="https://github.com/LennyGadroy/" target="_blank" class="ContactLink">GitHub</a></li>
                        <hr class="Divider">
                        <li><span class="ContactInfo">Reims</span></li>
                        <li><span class="ContactInfo">Charleville-Mézières</span></li>
                    </ul>
                </div>
            </div>
            <div class="Panel ContactFormPanel" id="contact-form">
                <h2 class="PanelTitle">Quel est votre message ?</h2>
                <form method="POST" action="https://formspree.io/f/xnnegzdy" class="Form">
                    <div class="InputGroup">
                        <input id="nom" type="text" name="nom" class="FormInput" required>
                        <label for="nom" class="FormLabel">Nom</label>
                    </div>
                    <div class="InputGroup">
                        <input id="email" type="email" name="email" class="FormInput" required>
                        <label for="email" class="FormLabel">Email</label>
                    </div>
                    <div class="InputGroup">
                        <input id="objet" type="text" name="objet" class="FormInput" required>
                        <label for="objet" class="FormLabel">Objet</label>
                    </div>
                    <div class="InputGroup">
                        <textarea id="message" name="message" rows="6" class="FormInput" required></textarea>
                        <label for="message" class="FormLabel">Message</label>
                    </div>
                    <div class="FormActions">
                        <button type="submit" class="BtnSolid" aria-label="Envoyer le message">Envoyer votre message</button>
                        <button type="reset" class="BtnOutline" aria-label="Effacer le formulaire">Réinitialiser</button>
                    </div>
                </form>
            </div>
        </div>
    </main>
    <div id="FooterPlaceHolder"></div><script src="footer.js"></script>
</body>
</html>
